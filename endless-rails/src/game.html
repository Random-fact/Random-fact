<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#0b1017">
<title>Endless Rails</title>
<meta name="description" content="Endless Rails — a calm, endless train journey simulator.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;600&family=Manrope:wght@400;600;800&display=swap">
<style>
/* Layout: full-bleed 3D view, HUD floats on top; controls hug the bottom edge (portrait) or both sides (landscape). */
:root{--ink:#0b1017;--ink2:#141c27;--paper:#e9e4d8;--steel:#9fb3c8;--brass:#e8a33d;--red:#d9503f;--green:#5fbf8a;--line:rgba(233,228,216,.16);--glass:rgba(11,16,23,.55);
--disp:'Oswald','Arial Narrow',Impact,sans-serif;--body:'Manrope','Segoe UI',system-ui,sans-serif;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overflow:hidden;background:var(--ink);color:var(--paper);font-family:var(--body);font-size:14px;overscroll-behavior:none;user-select:none;-webkit-user-select:none}
#app{position:fixed;inset:0;overflow:hidden;background:var(--ink)}
#gl,#glass{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
#glass{pointer-events:none}
#vignette{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,transparent 55%,rgba(0,0,0,.35) 100%)}
#hud{position:absolute;inset:0;pointer-events:none;transition:opacity .4s;z-index:19}
body.nohud #hud,body.nohud #ctl{opacity:0;pointer-events:none!important}
body.nohud #ctl *{pointer-events:none!important}
#top{position:absolute;left:max(12px,var(--sal));right:max(12px,var(--sar));top:max(10px,var(--sat));display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
#speedbox{display:flex;align-items:baseline;gap:6px;background:var(--glass);padding:6px 12px 6px;border:1px solid var(--line);backdrop-filter:blur(6px)}
#spd{font:600 44px/1 var(--disp);min-width:2.2ch;text-align:right;font-variant-numeric:tabular-nums}
.u{font:400 12px var(--disp);letter-spacing:.12em;color:var(--steel);text-transform:uppercase}
#info,#stn{background:var(--glass);border:1px solid var(--line);padding:6px 10px;backdrop-filter:blur(6px);min-width:0}
#info div,#stn div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#clock{font:600 18px var(--disp);letter-spacing:.06em}
#wx,#camname,#stndist,#sched{color:var(--steel);font-size:12px}
#stnname{font:600 16px var(--disp);letter-spacing:.05em;color:var(--brass)}
#stn{text-align:right}
#sched{color:var(--green)}
#banner{position:absolute;left:50%;top:22%;transform:translate(-50%,-6px);max-width:min(86vw,560px);text-align:center;font:600 20px/1.25 var(--disp);letter-spacing:.06em;text-shadow:0 2px 14px #000;opacity:0;transition:opacity .8s,transform .8s}
#banner.on{opacity:1;transform:translate(-50%,0)}
#limit{align-self:center;width:46px;height:46px;border-radius:50%;background:#fff;border:6px solid #d9202a;display:flex;align-items:center;justify-content:center;margin-left:8px;flex:none}
#limit b{font:600 18px var(--disp);color:#111;font-variant-numeric:tabular-nums}
#speedbox.over #spd{color:var(--red)}#speedbox.warn{border-color:var(--brass)}#speedbox.brake{border-color:var(--red);background:rgba(217,80,63,.35)}
#jtag{font:600 12px var(--disp);letter-spacing:.06em;pointer-events:auto;cursor:pointer;padding:2px 7px;border:1px solid currentColor;border-radius:5px;margin-left:8px}
#limnext{color:var(--brass);font:600 12px var(--disp);letter-spacing:.06em}
.cars{display:flex;align-items:center;gap:10px;margin:0 0 12px}.cars span{flex:none}.cars input{flex:1;min-width:80px}.cars b{min-width:2ch;text-align:right;color:var(--brass)}.cars button{width:34px;padding:6px 0}
.trains{display:grid;gap:8px;margin:12px 0}.trains .mode b{color:var(--brass)}
#evlog{z-index:21}#evlist{max-height:55vh;overflow:auto;font-size:13px;line-height:1.45}#evlist div{padding:6px 0;border-bottom:1px solid var(--line)}#evlist small{color:var(--steel)}
#evtag{position:absolute;left:max(12px,env(safe-area-inset-left,0px));top:104px;max-width:60vw;font:600 12px var(--disp);letter-spacing:.08em;color:var(--brass);text-shadow:0 1px 8px #000}
#bp{position:absolute;left:max(12px,env(safe-area-inset-left,0px));top:84px;font-size:11px;color:var(--steel);display:flex;gap:8px;align-items:center}
#bp i{display:block;width:80px;height:5px;background:rgba(255,255,255,.12);position:relative}
#bp b{position:absolute;inset:0 auto 0 0;background:var(--brass);width:100%}
#ctl{position:absolute;left:0;right:0;bottom:0;padding:8px max(12px,env(safe-area-inset-left,0px)) 12px;display:grid;grid-template-columns:76px 1fr 76px;gap:10px;align-items:end;pointer-events:none}
#ctl>*{pointer-events:auto}
.lever{height:34vh;min-height:150px;max-height:260px;display:flex;flex-direction:column;align-items:center;gap:4px;touch-action:none}
.lever .lab{font:400 12px var(--disp);letter-spacing:.14em;color:var(--steel)}
.lever .track{flex:1;width:46px;background:var(--glass);border:1px solid var(--line);position:relative;backdrop-filter:blur(6px);touch-action:none}
.lever .fill{position:absolute;left:0;right:0;bottom:0;height:0;background:linear-gradient(0deg,rgba(232,163,61,.65),rgba(232,163,61,.2))}
#brk .fill{background:linear-gradient(0deg,rgba(217,80,63,.7),rgba(217,80,63,.2))}
.lever .knob{position:absolute;left:-6px;right:-6px;height:14px;bottom:0;background:var(--paper);border-radius:2px;transform:translateY(7px);box-shadow:0 2px 8px #000}
.lever .val{font:600 15px var(--disp);font-variant-numeric:tabular-nums}
#btns{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;align-self:end}
button{font:600 13px var(--disp);letter-spacing:.1em;text-transform:uppercase;color:var(--paper);background:var(--glass);border:1px solid var(--line);min-height:52px;padding:8px 6px;backdrop-filter:blur(6px);cursor:pointer;touch-action:manipulation}
button:active,button.on{background:rgba(232,163,61,.28);border-color:var(--brass)}
button:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
button.danger{border-color:var(--red);color:#ffd9d3}
button.danger:active{background:rgba(217,80,63,.5)}
button.pri{background:var(--brass);color:#1a1206;border-color:var(--brass)}
#more{position:absolute;right:max(12px,env(safe-area-inset-right,0px));top:64px;width:min(300px,86vw);max-height:calc(100% - 80px);overflow:auto;background:rgba(11,16,23,.88);border:1px solid var(--line);padding:10px;display:none;gap:8px;grid-template-columns:1fr 1fr;pointer-events:auto;backdrop-filter:blur(10px)}
#more.open{display:grid}
#more h4{grid-column:1/-1;margin:6px 0 0;font:400 12px var(--disp);letter-spacing:.16em;color:var(--steel)}
#camchips{grid-column:1/-1;display:grid;grid-template-columns:1fr 1fr;gap:6px}
#camchips button{min-height:40px;font-size:12px}
#dev{position:absolute;right:8px;top:8px;width:min(300px,86vw);max-height:80vh;overflow:auto;background:rgba(10,14,20,.92);border:1px solid var(--brass);border-radius:8px;padding:10px;z-index:18;display:none;font:12px var(--body);color:#dfe6ee}#dev.open{display:block}#devtab{position:absolute;right:8px;top:8px;z-index:18;min-height:32px;padding:4px 10px;font-size:12px;background:rgba(10,14,20,.92);border:1px solid var(--brass);border-radius:8px;color:var(--brass)}#dev .dh{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}#dev label{display:block;margin:8px 0 4px;color:var(--steel)}#dev input[type=range]{width:100%}#dev .dq,#dev .de{display:flex;flex-wrap:wrap;gap:4px}#dev button{min-height:30px;padding:4px 8px;font-size:12px}
.ov{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:rgba(6,9,14,.78);backdrop-filter:blur(8px);padding:16px;overflow:auto;z-index:20}
.ov.open{display:flex}
.card{width:min(560px,100%);max-height:100%;overflow:auto;background:var(--ink2);border:1px solid var(--line);padding:20px}
#start{background:linear-gradient(180deg,rgba(6,9,14,.55),rgba(6,9,14,.92))}
#start h1{font:600 clamp(38px,9vw,64px)/.95 var(--disp);letter-spacing:.14em;margin:0 0 6px;color:var(--paper)}
#start h1 span{color:var(--brass)}
#start p{margin:0 0 14px;color:var(--steel);line-height:1.5}
#modes{display:grid;gap:8px;margin:14px 0}
.mode{text-align:left;text-transform:none;letter-spacing:.02em;font:400 13px var(--body);padding:10px 12px;display:block;min-height:0}
.mode b{display:block;font:600 14px var(--disp);letter-spacing:.1em;text-transform:uppercase;margin-bottom:2px}
.mode span{color:var(--steel)}
.mode.sel{border-color:var(--brass);background:rgba(232,163,61,.14)}
.row{display:flex;gap:8px;flex-wrap:wrap}.row>button{flex:1}
#load{color:var(--brass);font:400 13px var(--disp);letter-spacing:.14em;min-height:18px;margin-top:10px}
.set{display:grid;grid-template-columns:1fr auto;gap:6px 12px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line)}
.set label{font-size:13px}.set input[type=range]{width:min(180px,42vw);accent-color:#e8a33d}
.set select{background:var(--ink);color:var(--paper);border:1px solid var(--line);padding:6px;font:inherit}
.card h2{margin:0 0 8px;font:600 22px var(--disp);letter-spacing:.12em}
.note{color:var(--steel);font-size:12px;line-height:1.5;margin-top:10px}
@media (orientation:landscape){
  #ctl{top:auto;grid-template-columns:minmax(52px,84px) minmax(0,1fr) minmax(52px,84px);padding-bottom:10px}
  .lever{height:min(46vh,230px);min-height:110px}
  #btns{grid-template-columns:repeat(6,minmax(0,1fr));max-width:680px;justify-self:center;width:100%}
  button{min-height:46px;letter-spacing:.04em;padding:6px 2px;font-size:12px}
  #spd{font-size:50px}
}
@media (orientation:landscape) and (max-height:430px){
  #top{top:6px}#spd{font-size:34px}.lever{height:40vh}#clock{font-size:15px}
  #info div:nth-child(n+3){display:none}
}
@media (max-width:420px){#info{display:none}#stn{flex:1}}
@media (prefers-reduced-motion:reduce){#banner,#hud{transition:none}}
/* ===== responsive hardening: safe areas, dvh, no overlaps between HUD / banners / panels ===== */
#top{top:max(10px,var(--sat));left:max(12px,var(--sal));right:max(12px,var(--sar))}
#spd{font-size:clamp(34px,6.2vmin,64px)}
#info,#stn{font-size:clamp(11px,1.9vmin,15px)}
#clock{font-size:clamp(15px,2.8vmin,22px)}
#stnname{font-size:clamp(14px,2.4vmin,19px)}
#bp{top:calc(max(10px,var(--sat)) + clamp(62px,10vmin,88px));left:max(12px,var(--sal));right:max(12px,var(--sar));flex-wrap:wrap;row-gap:2px;font-size:clamp(10px,1.6vmin,13px);pointer-events:none}
#jtag{pointer-events:auto}
#evtag{top:calc(max(10px,var(--sat)) + clamp(82px,13vmin,112px));left:max(12px,var(--sal));max-width:min(60vw,520px);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#banner{background:rgba(8,12,18,.82);border-radius:8px;padding:6px 14px;top:calc(max(10px,var(--sat)) + clamp(104px,17vmin,150px));font-size:clamp(14px,3.6vmin,22px);width:max-content;max-width:min(88vw,560px)}
#ctl{padding:8px max(12px,var(--sar)) max(12px,var(--sab)) max(12px,var(--sal));grid-template-columns:minmax(48px,76px) minmax(0,1fr) minmax(48px,76px)}
#btns button{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#more{top:calc(max(10px,var(--sat)) + 62px);right:max(12px,var(--sar));max-height:calc(100dvh - 140px)}
.mode span{display:block;font:400 12px/1.4 var(--body)}
.card{max-height:calc(100dvh - 32px)}
.card .row{position:sticky;bottom:-20px;background:var(--ink2);padding:10px 0 4px;margin-top:8px;z-index:2}
#dev{left:max(96px,calc(var(--sal) + 96px));right:auto;top:calc(max(10px,var(--sat)) + clamp(104px,17vmin,150px));width:min(330px,calc(100vw - 210px));max-height:calc(100dvh - 300px)}
#devtab{right:max(8px,var(--sar));top:calc(max(10px,var(--sat)) + clamp(62px,10vmin,88px))}
@media (orientation:portrait){
  #dev{left:max(8px,var(--sal));right:max(8px,var(--sar));width:auto;top:calc(max(10px,var(--sat)) + clamp(104px,17vmin,150px) + 78px);max-height:calc(100dvh - 520px);min-height:150px}
}
@media (orientation:landscape){body.devopen #banner{left:calc(50% - 150px);max-width:calc(100vw - 560px)}#dev{left:auto;right:calc(max(8px,var(--sar)) + 92px);width:min(320px,40vw);top:calc(max(10px,var(--sat)) + clamp(64px,10vmin,90px));max-height:calc(100dvh - 190px)}#devtab{top:calc(max(10px,var(--sat)) + clamp(64px,10vmin,90px))}}
@media (orientation:landscape) and (max-height:430px){
  #bp{top:calc(max(6px,var(--sat)) + 50px)}#evtag{top:calc(max(6px,var(--sat)) + 66px)}#banner{top:calc(max(6px,var(--sat)) + 82px)}
  #dev{top:calc(max(6px,var(--sat)) + 56px);max-height:calc(100dvh - 130px)}#devtab{top:calc(max(6px,var(--sat)) + 56px)}
  #more{top:calc(max(6px,var(--sat)) + 44px);max-height:calc(100dvh - 60px)}
  .card{padding:12px 16px}
}
@media (orientation:landscape) and (max-height:480px){
  #start h1{font-size:30px;margin:0 0 2px}#start p{display:none}#start .card{width:min(760px,100%)}
  #modes,.trains{grid-template-columns:1fr 1fr;margin:8px 0}.cars{margin:0 0 6px}
}
@media (max-width:480px) and (orientation:portrait){#btns{grid-template-columns:repeat(2,minmax(0,1fr))}#btns button{font-size:12px;letter-spacing:.05em;padding:6px 2px}.lever{height:30vh}}
@media (max-width:359px){button{font-size:11px;letter-spacing:.04em}#btns{gap:5px}#ctl{grid-template-columns:60px 1fr 60px;gap:6px}.lever .track{width:38px}}
@media (min-width:900px) and (min-height:700px){#btns{max-width:760px;justify-self:center;width:100%}}
/* event card */
#evcard{position:absolute;right:max(12px,var(--sar));top:calc(max(10px,var(--sat)) + clamp(66px,11vmin,92px));width:min(340px,calc(100vw - 24px));background:rgba(10,14,20,.86);border:1px solid var(--line);border-left:4px solid var(--brass);padding:10px 12px;display:flex;gap:10px;align-items:flex-start;transform:translateX(calc(100% + 40px));opacity:0;transition:transform .55s cubic-bezier(.2,.8,.2,1),opacity .55s;pointer-events:none;backdrop-filter:blur(8px);z-index:19;border-radius:6px}
#evcard.on{transform:none;opacity:1}
#evcard .ic{font-size:26px;line-height:1.1;flex:none;width:34px;text-align:center}
#evcard b{display:block;font:600 15px var(--disp);letter-spacing:.06em;text-transform:uppercase}
#evcard span{display:block;font-size:12.5px;opacity:.88;margin-top:2px;line-height:1.35}
body.photoMode #ctl{display:none}body.photoMode #walkpad{left:auto!important;right:max(16px,var(--sar));transform:none!important;bottom:max(16px,var(--sab))!important}
#evcard small{display:inline-block;margin-top:6px;font:600 10px var(--disp);letter-spacing:.12em;text-transform:uppercase;padding:1px 6px;border:1px solid currentColor;border-radius:4px}
body.menuopen #evcard,body.nohud #evcard{opacity:0!important}
#sigtag{display:inline-flex;align-items:center;gap:4px}#sigtag i{display:inline-block;width:9px;height:9px;border-radius:50%;background:#2cf07a;box-shadow:0 0 6px currentColor}
@media (max-width:600px) and (orientation:portrait){#evcard{left:max(12px,var(--sal));right:max(12px,var(--sar));width:auto;top:calc(max(10px,var(--sat)) + clamp(150px,34vmin,190px))}}
@media (orientation:landscape) and (max-height:430px){#evcard{top:calc(max(6px,var(--sat)) + 44px);width:min(300px,40vw);padding:6px 10px}#evcard .ic{font-size:20px}#evcard span{font-size:11.5px}}
/* ===== Design system v2: one palette, spacing scale, radii and type scale for menus, dialogs and HUD ===== */
:root{--r1:6px;--r2:10px;--r3:16px;--sp1:6px;--sp2:10px;--sp3:16px;--sp4:24px;--panel:rgba(12,17,25,.9);--panel2:rgba(20,28,40,.92);--hi:rgba(232,163,61,.16);--focus:#ffd28a;
  --sat:max(env(safe-area-inset-top,0px),var(--ins-t,0px));--sab:max(env(safe-area-inset-bottom,0px),var(--ins-b,0px));--sal:max(env(safe-area-inset-left,0px),var(--ins-l,0px));--sar:max(env(safe-area-inset-right,0px),var(--ins-r,0px))}
html.cjk{--disp:'Noto Sans SC','Noto Sans JP','PingFang SC','Hiragino Sans','Microsoft YaHei',sans-serif;--body:'Noto Sans SC','Noto Sans JP','PingFang SC','Hiragino Sans','Microsoft YaHei',system-ui,sans-serif}
html.cjk *{letter-spacing:0!important}
button{border-radius:var(--r2);transition:background .15s,border-color .15s,transform .08s;line-height:1.15;white-space:normal;overflow-wrap:anywhere;hyphens:auto}
button:active{transform:scale(.97)}
button:disabled{opacity:.45;pointer-events:none}
#btns button{white-space:normal;text-overflow:clip;font-size:clamp(10.5px,1.55vmin + 4px,13px)}
#speedbox,#info,#stn,#bp,#limit{border-radius:var(--r2)}
#speedbox{box-shadow:0 6px 20px rgba(0,0,0,.25)}
#bp{background:rgba(8,12,18,.45);padding:3px 8px;width:max-content;max-width:calc(100% - 24px)}
#fps{color:#7fe0ff;font:600 11px var(--disp)}
.lever .track{border-radius:var(--r2);overflow:hidden}
.lever .knob{border-radius:4px}
.card{border-radius:var(--r3);box-shadow:0 20px 60px rgba(0,0,0,.45)}
.card.wide{width:min(720px,100%)}
.card .row{gap:var(--sp2)}
.ov{z-index:30}
/* ----- main menu ----- */
#start{background:radial-gradient(ellipse at 70% 20%,rgba(232,163,61,.12),transparent 60%),linear-gradient(180deg,rgba(6,9,14,.35),rgba(6,9,14,.9));padding:0;align-items:stretch;justify-content:stretch}
#menu{display:grid;grid-template-columns:minmax(220px,300px) 1fr;gap:var(--sp3);width:100%;height:100%;padding:max(16px,var(--sat)) max(16px,var(--sar)) max(16px,var(--sab)) max(16px,var(--sal))}
#menu .side{display:flex;flex-direction:column;gap:var(--sp2);min-height:0}
#menu h1{font:600 clamp(30px,5.5vmin,52px)/.95 var(--disp);letter-spacing:.14em;margin:6px 0 0}
#menu h1 span{color:var(--brass)}
#menu .tag{margin:0;color:var(--steel);font-size:13px}
#menunav{display:flex;flex-direction:column;gap:8px;overflow:auto;padding:4px 2px}
#menunav button{text-align:left;min-height:48px;padding:10px 14px;display:flex;gap:10px;align-items:center;font-size:14px;text-transform:none;letter-spacing:.04em}
#menunav button .ic{width:22px;text-align:center;flex:none}
#menunav button.on{background:var(--hi);border-color:var(--brass)}
#menunav button.pri{background:var(--brass);color:#1a1206}
#menu .main{background:var(--panel);border:1px solid var(--line);border-radius:var(--r3);padding:var(--sp3) var(--sp4);overflow:auto;min-height:0;backdrop-filter:blur(10px)}
#menu .main h2{font:600 22px var(--disp);letter-spacing:.1em;margin:0 0 var(--sp1)}
#menu .main h3{font:600 15px var(--disp);letter-spacing:.1em;color:var(--steel);margin:var(--sp3) 0 var(--sp1);text-transform:uppercase}
#menu .main p.lead{color:var(--steel);margin:0 0 var(--sp3);line-height:1.5}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:var(--sp2)}
.cards .mode{border-radius:var(--r2);min-height:88px;position:relative;padding:12px 14px}
.cards .mode.locked{opacity:.85}
.cards .mode .lock{display:block;margin:0 0 4px;font-size:11px;color:var(--brass);font-family:var(--disp);letter-spacing:.06em}
.cars{flex-wrap:wrap}
.chips{display:flex;flex-wrap:wrap;gap:8px}.chips button{min-height:40px;padding:6px 12px;font-size:12px}

.lessons{display:grid;gap:var(--sp2)}

#loading .bar{height:6px;background:rgba(255,255,255,.1);border-radius:3px;overflow:hidden}#loading .bar i{display:block;height:100%;width:0;background:var(--brass);transition:width .2s}

#dlg{z-index:45}#dlg .card{width:min(460px,100%);text-align:center}#dlg .dic{font-size:40px}#dlg p{color:var(--steel);line-height:1.5}#dlg .row{justify-content:center}
/* ----- training panel and braking assistant ----- */
#lesson{position:absolute;left:50%;transform:translateX(-50%);top:calc(max(10px,var(--sat)) + clamp(96px,15vmin,130px));width:min(560px,calc(100vw - 24px));max-height:46vh;overflow:auto;background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--brass);border-radius:var(--r2);padding:10px 14px;display:none;z-index:21;backdrop-filter:blur(8px)}
#lesson.on{display:block}#lesson .lh{display:flex;justify-content:space-between;gap:10px}#lesson .lt{font:600 14px var(--disp);letter-spacing:.06em;color:var(--brass)}#lesson .lp{font:600 12px var(--disp);color:var(--steel)}

#guide{position:absolute;right:max(12px,var(--sar));top:calc(max(10px,var(--sat)) + clamp(66px,11vmin,92px));width:min(230px,44vw);background:var(--panel);border:1px solid var(--line);border-radius:var(--r2);padding:8px 10px;display:none;font-size:12px}
#guide.on{display:block}#guide .gh{font:600 11px var(--disp);letter-spacing:.1em;color:var(--steel);text-transform:uppercase;margin-bottom:4px}
#guide .gr{display:flex;justify-content:space-between;gap:8px}#guide .gr b{font:600 15px var(--disp);font-variant-numeric:tabular-nums}
#guide .gscale{position:relative;height:10px;margin:6px 0 4px;background:linear-gradient(90deg,#e0607a,#e8c33d 40%,#5fe08a 50%,#e8c33d 60%,#e0607a);border-radius:5px;opacity:.75}
#guide .gscale i{position:absolute;left:50%;top:-3px;bottom:-3px;width:2px;background:#fff}#guide .gscale em{position:absolute;top:-4px;width:8px;height:18px;margin-left:-4px;background:#fff;border-radius:3px;box-shadow:0 0 6px #000}
#gd-adv{font:600 12.5px var(--body);color:var(--paper)}#gd-adv.warn{color:#ffd166}#gd-adv.bad{color:#ff7a6a}

  #guide{top:auto;bottom:calc(max(12px,var(--sab)) + 34vh + 70px);right:max(8px,var(--sar))}#lesson{top:calc(max(10px,var(--sat)) + 96px);max-height:38vh}}
@media (orientation:landscape) and (max-height:480px){#menu{grid-template-columns:minmax(190px,240px) 1fr}#menu h1{font-size:26px}#menu .tag{display:none}#menunav button{min-height:40px;padding:6px 10px}

/* ===================== HUD v3: flow layout (no guessed offsets, nothing can overlap) =====================
   #hud spans from the top safe area down to the top of the control area (measured: --ctlm = buttons row,
   --ctlh = tallest lever). Landscape: three columns. Portrait: the same elements re-arranged in rows. */
#hud{position:absolute;left:0;right:0;top:0;bottom:var(--ctlm,150px);padding:max(8px,var(--sat)) max(10px,var(--sar)) 6px max(10px,var(--sal));
  display:grid;grid-template-columns:minmax(0,max-content) minmax(0,1fr) minmax(0,max-content);grid-template-rows:minmax(0,1fr);column-gap:10px;align-items:start;pointer-events:none}
#hudL,#hudC,#hudR{display:flex;flex-direction:column;gap:6px;min-height:0;max-height:100%;min-width:0}
#hudL,#hudR{max-height:calc(100% - var(--ctlh,150px) + var(--ctlm,150px))}
#hudL{max-width:min(34vw,330px);align-items:flex-start}
#hudR{width:min(26vw,250px);align-items:stretch}
#hudC{align-items:center;overflow:hidden}
#top{display:contents}
#speedcard{background:var(--glass);border:1px solid var(--line);border-radius:var(--r2);padding:5px 10px 6px;backdrop-filter:blur(6px);display:flex;flex-direction:column;gap:3px;min-width:0;max-width:100%}
#speedcard #speedbox{position:static;background:none;border:0;padding:0;backdrop-filter:none;gap:6px;align-items:center}
#speedcard.over #spd,#speedbox.over #spd{color:var(--red)}
#speedcard:has(#speedbox.warn){border-color:var(--brass)}#speedcard:has(#speedbox.brake){border-color:var(--red);background:rgba(217,80,63,.3)}
#speedbox.warn,#speedbox.brake{border:0;background:none}
#spd{font-size:clamp(28px,5.4vmin,52px)}
#speedbox .u{font-size:clamp(10px,1.6vmin,13px)}
#limit{width:clamp(32px,6vmin,44px);height:clamp(32px,6vmin,44px);border-width:clamp(4px,.8vmin,6px);margin-left:4px}
#limit b{font-size:clamp(13px,2.4vmin,18px)}
#bp{position:static;display:flex;flex-wrap:wrap;align-items:center;gap:2px 8px;font-size:clamp(10.5px,1.55vmin,12.5px);color:var(--steel);background:none;border:0;padding:0;margin:0;max-width:100%}
#bp i{width:clamp(36px,7vmin,64px);height:4px}
#bp>span:empty{display:none}
#sigtag em{font-style:normal}
#jtag{margin-left:0;font-size:clamp(10px,1.5vmin,12px);padding:1px 6px}
#fps{font-size:clamp(10px,1.5vmin,11.5px)}
#evtag{position:static;max-width:100%;font-size:clamp(10.5px,1.6vmin,12px);white-space:normal;line-height:1.25}
#evtag:empty{display:none}
#info{position:static;text-align:center;padding:4px 10px;max-width:100%}
#info #clock{font-size:clamp(13px,2.5vmin,20px)}
#info #wx,#info #camname{font-size:clamp(10.5px,1.6vmin,12px)}
#stn{position:static;padding:5px 10px;text-align:right}
#stnname{font-size:clamp(13px,2.3vmin,18px)}#stndist,#sched{font-size:clamp(10.5px,1.6vmin,12px)}
#sched:empty{display:none}
#banner{position:static;transform:none;width:auto;max-width:min(100%,520px);margin:0 auto;font-size:clamp(12.5px,2.6vmin,18px);padding:5px 12px;border-radius:8px;background:rgba(8,12,18,.82)}
#banner.on{transform:none}#banner:empty{display:none}
body.devopen #banner{left:auto;max-width:min(100%,520px)}
/* lesson panel: compact card, header with step counter and a fixed close button, scrollable text */
#lesson{position:static;transform:none;left:auto;top:auto;width:100%;max-width:520px;max-height:100%;display:none;flex-direction:column;min-height:0;
  background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--brass);border-radius:var(--r2);padding:6px 8px 7px 10px;pointer-events:auto;overflow:hidden}
#lesson.on{display:flex}
#lesson .lh{display:flex;align-items:center;gap:8px;flex:none}

#lesson .lp{flex:none;font:600 11px var(--disp);color:var(--steel)}

/* braking assistant: compact two-metric card */

@media (orientation:portrait){
  #hud{bottom:var(--ctlh,40vh);grid-template-columns:minmax(0,1fr) minmax(0,1fr);grid-template-rows:auto auto auto auto auto auto auto minmax(0,1fr);row-gap:6px;column-gap:8px;align-content:start;

/* ===================== sheets & cards: fixed header with close button, only the content scrolls ===================== */
#more.sheet,#dev.sheet{position:absolute;display:none;flex-direction:column;overflow:hidden;pointer-events:auto;z-index:22;background:rgba(10,14,20,.94);border:1px solid var(--line);border-radius:var(--r3);backdrop-filter:blur(10px);
  top:max(8px,var(--sat));bottom:calc(var(--ctlh,150px) + 6px);right:max(8px,var(--sar));left:auto;width:min(330px,40vw);max-height:none;min-height:0;padding:0}
#more.sheet.open,#dev.sheet.open{display:flex}
#more{grid-template-columns:none;max-height:none;gap:0}

#more .mh b,#dev .dh b{font:600 14px var(--disp);letter-spacing:.12em}
.sheet .x,.card .x{min-height:36px;width:40px;padding:0;font-size:22px;line-height:1;flex:none}

#camchips{display:flex;flex-wrap:wrap;gap:6px}#camchips button{min-height:34px;padding:4px 8px;font-size:11px}
/* events panel: same structure, at the edge, compact */
#dev.sheet{font:12px var(--body);color:#dfe6ee;border-color:rgba(232,163,61,.55);width:min(290px,36vw)}
#dev .dbody{flex:1;min-height:0;overflow:auto;-webkit-overflow-scrolling:touch;padding:8px 10px 10px}

#dev .dq button,#dev .de button{min-height:30px;padding:3px 8px;font-size:11px;letter-spacing:.03em}
#dev .dh button{min-height:32px;padding:4px 10px;font-size:11px}
#hud #devtab{position:static;align-self:flex-end;pointer-events:auto;min-height:34px;padding:4px 10px;font-size:11px;z-index:21}
body.menuopen #devtab,body.moreopen #devtab{display:none!important}
/* landscape: a side sheet (in-game menu or events) stands at the right screen edge above the brake lever, and the HUD
   columns make room for it instead of being covered */
@media (orientation:landscape){
  body.sideopen #hud{padding-right:calc(min(330px,40vw) + max(8px,var(--sar)) + 10px);grid-template-columns:minmax(0,max-content) minmax(0,1fr);grid-template-rows:auto minmax(0,1fr)}
  body.sideopen #hudL{grid-column:1;grid-row:1}body.sideopen #hudR{grid-column:1;grid-row:2;width:min(30vw,250px);max-height:none}body.sideopen #hudC{grid-column:2;grid-row:1/3}
  /* the left column ends above the traction lever (measured); if a lesson fills it, it scrolls instead of overlapping */
  body.sideopen #hudR{max-height:var(--hudrmax,none);overflow-y:auto;overscroll-behavior:contain;pointer-events:auto;scrollbar-width:thin}
  /* the station card becomes one line so the left column stays above the traction lever */
  body.sideopen #stn{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;column-gap:8px;padding:3px 10px;text-align:left}
  body.sideopen #stn div{white-space:normal}
}
/* narrow landscape: too little room for columns beside the sheet, so the HUD uses the compact portrait arrangement */

  body.sideopen #hud{grid-template-columns:minmax(0,1fr) minmax(0,1fr);grid-template-rows:none;grid-auto-rows:max-content;row-gap:5px;column-gap:6px;align-content:start;
    grid-template-areas:"spd stn" "bp bp" "evt evt" "inf inf" "gd gd" "les les" "ban ban" "evc evc"}
  body.sideopen #hudL,body.sideopen #hudC,body.sideopen #hudR,body.sideopen #speedcard{display:contents}
  body.sideopen #speedbox{grid-area:spd;background:var(--glass);border:1px solid var(--line);border-radius:var(--r2);padding:3px 8px;backdrop-filter:blur(6px);align-self:stretch}
  body.sideopen #spd{font-size:26px}
  body.sideopen #stn{grid-area:stn;align-self:stretch}
  body.sideopen #bp{grid-area:bp;background:var(--glass);border:1px solid var(--line);border-radius:var(--r2);padding:3px 8px;backdrop-filter:blur(6px);justify-content:flex-start}
  body.sideopen #evtag{grid-area:evt}
  body.sideopen #hud #info{grid-area:inf;display:flex;flex-wrap:wrap;justify-content:center;column-gap:8px;align-items:baseline;padding:2px 8px;justify-self:stretch}
  body.sideopen #info>div{white-space:nowrap}
  body.sideopen #guide{grid-area:gd}body.sideopen #lesson{grid-area:les}body.sideopen #banner{grid-area:ban;padding:4px 8px}body.sideopen #evcard{grid-area:evc}
  body.sideopen #bp{font-size:11px}body.sideopen #hud #info{font-size:11px}body.sideopen #banner{font-size:12px;line-height:1.3}
  /* the rows sit between the traction lever and the sheet (down to the button row); a lesson that needs more room scrolls */
  body.sideopen #hud{padding-left:calc(max(10px,var(--sal)) + 84px);overflow-y:auto;overscroll-behavior:contain;pointer-events:auto;scrollbar-width:thin}
}
@media (orientation:portrait){
  #more.sheet,#dev.sheet{left:max(8px,var(--sal));right:max(8px,var(--sar));width:auto;top:auto;bottom:calc(var(--ctlh,40vh) + 6px);height:min(56vh,calc(100dvh - var(--ctlh,40vh) - 110px))}
  #dev.sheet{height:var(--devh,min(38vh,calc(100dvh - var(--ctlh,40vh) - 210px)))}

const InputManager = {
  keys: {}, lookDX: 0, lookDY: 0, zoom: 0, pointers: new Map(), pinch0: 0, moved: 0,
  pad: { thr: null, brk: null, look: [0, 0], move: [0, 0] },
  onKey: null,
  init(canvas) {
    window.addEventListener('keydown', e => {
      if (e.target && /INPUT|SELECT/.test(e.target.tagName)) return;
      if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', ' ', 'Tab'].includes(e.key)) e.preventDefault();
      if (!this.keys[e.code] && this.onKey) this.onKey(e);
      this.keys[e.code] = true;
    });
    window.addEventListener('keyup', e => { this.keys[e.code] = false; });
    window.addEventListener('blur', () => { this.keys = {}; });
    canvas.addEventListener('pointerdown', e => {
      canvas.setPointerCapture(e.pointerId);
      this.pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
      if (this.pointers.size === 2) this.pinch0 = this.pdist();
    });
    canvas.addEventListener('pointermove', e => {
      const p = this.pointers.get(e.pointerId); if (!p) return;
      const dx = e.clientX - p.x, dy = e.clientY - p.y; p.x = e.clientX; p.y = e.clientY;
      if (this.pointers.size === 1) { this.lookDX += dx; this.lookDY += dy; }
      else if (this.pointers.size === 2) { const d = this.pdist(); this.zoom += (this.pinch0 - d) * 0.01; this.pinch0 = d; }
    });
    const up = e => { this.pointers.delete(e.pointerId); };
    canvas.addEventListener('pointerup', up); canvas.addEventListener('pointercancel', up);
    canvas.addEventListener('wheel', e => { e.preventDefault(); this.zoom += Math.sign(e.deltaY) * 0.6; }, { passive: false });
    canvas.addEventListener('contextmenu', e => e.preventDefault());
  },
  pdist() { const a = [...this.pointers.values()]; if (a.length < 2) return 0; return Math.hypot(a[0].x - a[1].x, a[0].y - a[1].y); },
  take() { const r = { dx: this.lookDX, dy: this.lookDY * (SettingsManager.v.invertY ? -1 : 1), zoom: this.zoom }; this.lookDX = this.lookDY = this.zoom = 0; return r; },
  pollPad() {
    const g = (navigator.getGamepads ? navigator.getGamepads() : [])[0];
    const P = this.pad; P.thr = P.brk = null; P.look = [0, 0]; P.move = [0, 0];
    if (!g) return false;
    const dz = v => Math.abs(v) < .15 ? 0 : v;
    P.look = [dz(g.axes[2] || 0), dz(g.axes[3] || 0)]; P.move = [dz(g.axes[0] || 0), dz(g.axes[1] || 0)];
    const b = i => g.buttons[i] ? g.buttons[i].value : 0;
    P.thr = b(7); P.brk = b(6); P.horn = b(0) > .5; P.cam = b(3) > .5; P.lights = b(2) > .5; P.emerg = b(1) > .5;
    return true;
  }
};

,"Швидкісний потяг «Стріла HS»":["“Strela HS” high-speed train","Скоростной поезд «Стрела HS»","“Strela HS”高速列车","Trenul de mare viteză „Strela HS”","Trem de alta velocidade «Strela HS»","Tren de alta velocidad «Strela HS»","Train à grande vitesse « Strela HS »","Hochgeschwindigkeitszug „Strela HS“","高速列車「Strela HS」"],"Сучасний швидкісний електропоїзд з довгим аеродинамічним носом: до 250 км/год, ступінчаста тяга, склоекранна кабіна.":["A modern high-speed electric train with a long aerodynamic nose: up to 250 km/h, notched throttle, glass cockpit.","Современный скоростной электропоезд с длинным аэродинамическим носом: до 250 км/ч, ступенчатая тяга, цифровая кабина с экранами.","现代化高速动车组，配有修长的流线型车头：最高 250 公里/小时，有级牵引，全景玻璃司机室。","Tren electric modern de mare viteză, cu bot aerodinamic lung: până la 250 km/h, tracțiune în trepte, cabină cu ecrane digitale.","Trem elétrico moderno de alta velocidade com nariz aerodinâmico longo: até 250 km/h, tração escalonada, cabine envidraçada.","Moderno tren eléctrico de alta velocidad con un largo morro aerodinámico: hasta 250 km/h, tracción escalonada y cabina con pantallas digitales.","Rame électrique moderne à grande vitesse au long nez aérodynamique : jusqu’à 250 km/h, traction par crans, poste de conduite à écrans.","Moderner elektrischer Hochgeschwindigkeitstriebzug mit langer, aerodynamischer Nase: bis 250 km/h, gestufte Zugkraft, Führerstand mit Glascockpit.","長い流線形の先頭部を持つ最新の高速電車。最高250 km/h、ノッチ式力行、グラスコックピット式の運転台。"],"Склад до 8 вагонів":["Up to 8 cars","Состав до 8 вагонов","最长 8 节编组","Garnitură de până la 8 vagoane","Composição de até 8 vagões","Composición de hasta 8 vagones","Rame jusqu’à 8 voitures","Zug mit bis zu 8 Wagen","最大8両編成"],"Дозволяє формувати потяг із 7–8 вагонів. Довший склад важчий: повільніше розганяється й довше гальмує.":["Lets you form a train of 7–8 cars. A longer consist is heavier: it accelerates more slowly and takes longer to brake.","Позволяет формировать поезд из 7–8 вагонов. Более длинный состав тяжелее: медленнее разгоняется и дольше тормозит.","可将列车编组为 7–8 节车厢。编组越长越重：加速更慢，制动距离更长。","Permite formarea unui tren de 7–8 vagoane. O garnitură mai lungă este mai grea: accelerează mai încet și frânează pe o distanță mai mare.","Permite formar trens de 7–8 vagões. Uma composição mais longa é mais pesada: acelera mais devagar e demora mais para frear.","Permite formar trenes de 7–8 vagones. Una composición más larga pesa más: acelera más despacio y tarda más en frenar.","Permet de composer un train de 7–8 voitures. Une rame plus longue est plus lourde : elle accélère plus lentement et freine sur une plus longue distance.","Ermöglicht Züge mit 7–8 Wagen. Ein längerer Zug ist schwerer: Er beschleunigt langsamer und bremst länger.","7–8両編成の列車を組めるようになります。長い編成ほど重く、加速が遅く、制動距離も長くなります。"],"Склад до 10 вагонів":["Up to 10 cars","Состав до 10 вагонов","最长 10 节编组","Garnitură de până la 10 vagoane","Composição de até 10 vagões","Composición de hasta 10 vagones","Rame jusqu’à 10 voitures","Zug mit bis zu 10 Wagen","最大10両編成"],"Потяг до 10 вагонів (включно з меншими складами).":["A train of up to 10 cars (shorter consists included).","Поезд до 10 вагонов (включая более короткие составы).","列车最多可编组 10 节车厢（含更短编组）。","Tren de până la 10 vagoane (inclusiv garnituri mai scurte).","Trem de até 10 vagões (incluindo composições menores).","Trenes de hasta 10 vagones (incluidas las composiciones más cortas).","Train jusqu’à 10 voitures (compositions plus courtes incluses).","Züge mit bis zu 10 Wagen (kürzere Züge inklusive).","最大10両の列車（それより短い編成を含む）。"],"Склад до 12 вагонів":["Up to 12 cars","Состав до 12 вагонов","最长 12 节编组","Garnitură de până la 12 vagoane","Composição de até 12 vagões","Composición de hasta 12 vagones","Rame jusqu’à 12 voitures","Zug mit bis zu 12 Wagen","最大12両編成"],"Потяг до 12 вагонів (включно з меншими складами).":["A train of up to 12 cars (shorter consists included).","Поезд до 12 вагонов (включая более короткие составы).","列车最多可编组 12 节车厢（含更短编组）。","Tren de până la 12 vag rlier or apply the brake harder on the approach.","Вы проехали метку на {0} м: торможение началось слишком поздно или было слишком слабым. Начните тормозить примерно на {0} м раньше или сильнее затормозите на подъезде.","你越过了停车标 {0} 米：开始制动太晚或制动力不足。请提前约 {0} 米开始制动，或在接近时加大制动。","Ați depășit marcajul cu {0} m: frânarea a început prea târziu sau a fost prea slabă. Începeți să frânați cu aproximativ {0} m mai devreme sau acționați frâna mai puternic la apropiere.","Você passou da marca em {0} m: a frenagem começou tarde demais ou foi fraca demais. Comece a frear cerca de {0} m antes ou aplique mais freio na aproximação.","Te pasaste de la marca {0} m: empezaste a frenar demasiado tarde o con poca fuerza. Empieza a frenar unos {0} m antes o aplica más freno en la aproximación.","Vous avez dépassé le repère de {0} m : le freinage a commencé trop tard ou était trop faible. Commencez à freiner environ {0} m plus tôt ou serrez davantage le frein à l’approche.","Du bist {0} m über die Marke hinausgefahren: Die Bremsung begann zu spät oder war zu schwach. Beginne etwa {0} m früher zu bremsen oder bremse bei der Einfahrt stärker.","停止位置目標を{0} m行き過ぎました。ブレーキの開始が遅すぎたか、弱すぎました。約{0} m手前からブレーキをかけ始めるか、進入時にブレーキを強めてください。"],"Потяг зупинився за {0} м до мітки: гальмо було засильним або ви почали гальмувати зарано. Послабте гальмо, коли швидкість упаде, і дотягніть до мітки.":["The train stopped {0} m short of the mark: the brake was too strong or you started braking too early. Ease off the brake as the speed drops and roll up to the mark.","Поезд остановился за {0} м до метки: тормоз был слишком сильным или вы начали тормозить слишком рано. Ослабьте тормоз, когда скорость упадёт, и дотяните до метки.","列车停在停车标前 {0} 米处：制动过强或开始制动过早。速度降下来后请减小制动，让列车行至停车标。","Trenul s-a oprit cu {0} m înainte de marcaj: frâna a fost prea puternică sau ați început să frânați prea devreme. Slăbiți frâna când viteza scade și rulați până la marcaj.","O trem parou {0} m antes da marca: o freio estava forte demais ou você começou a frear cedo demais. Alivie o freio quando a velocidade cair e avance até a marca.","El tren se detuvo {0} m antes de la marca: frenaste con demasiada fuerza o empezaste demasiado pronto. Afloja el freno cuando baje la velocidad y avanza hasta la marca.","Le train s’est arrêté {0} m avant le repère : le freinage était trop fort ou vous avez commencé à freiner trop tôt. Desserrez le frein quand la vitesse baisse et avancez jusqu’au repère.","Der Zug hat {0} m vor der Marke gehalten: Die Bremse war zu stark oder du hast zu früh gebremst. Löse die Bremse etwas, wenn die Geschwindigkeit sinkt, und rolle bis zur Marke.","停止位置目標の{0} m手前で停車しました。ブレーキが強すぎたか、かけ始めが早すぎました。速度が落ちたらブレーキを緩め、停止位置目標まで進めてください。"],"Зупинено точно":["Stopped precisely","Остановлен точно","停车精准","Oprit exact","Parada exata","Parada exacta","Arrêté au repère","Punktgenau gehalten","定位置に停車"],"Потяг стоїть":["Train stationary","Поезд стоит","列车已停车","Trenul staționează","Trem parado","Tren detenido","Train à l’arrêt","Zug steht","停車中"],"Екстрене гальмування!":["Emergency braking!","Экстренное торможение!","紧急制动！","Frânare de urgență!","Frenagem de emergência!","¡Frenado de emergencia!","Freinage d’urgence !","Schnellbremsung!","非常ブレーキ！"],"Гальмуйте сильніше: потрібно ≈{0}%":["Brake harder: ≈{0}% needed","Тормозите сильнее: нужно ≈{0}%","加大制动：需要 ≈{0}%","Frânați mai puternic: e nevoie de ≈{0}%","Freie mais forte: são necessários ≈{0}%","Frena más fuerte: se necesita ≈{0}%","Freinez plus fort : ≈{0} % nécessaires","Stärker bremsen: ≈{0}% nötig","ブレーキを強めてください：≈{0}%必要"],"Гальмуйте зараз: ≈{0}%":["Brake now: ≈{0}%","Тормозите сейчас: ≈{0}%","立即制动：≈{0}%","Frânați acum: ≈{0}%","Freie agora: ≈{0}%","Frena ahora: ≈{0}%","Freinez maintenant : ≈{0} %","Jetzt bremsen: ≈{0}%","今すぐブレーキ：≈{0}%"],"Послабте гальмо — зупинитеся зарано":["Ease off the brake — you’ll stop short","Ослабьте тормоз — остановитесь слишком рано","减小制动——否则会过早停车","Slăbiți frâna — veți opri prea devreme","Alivie o freio — você vai parar cedo demais","Afloja el freno — te detendrás antes de tiempo","Desserrez le frein — arrêt trop tôt","Bremse etwas lösen — du hältst zu früh","ブレーキを緩めてください — 手前で止まります"],"Службове гальмування (50%) почніть за {0}":["Start service braking (50%) in {0}","Служебное торможение (50%) начните через {0}","{0}后开始常用制动（50%）","Începeți frânarea de serviciu (50%) peste {0}","Inicie a frenagem de serviço (50%) em {0}","Inicia el frenado de servicio (50%) dentro de {0}","Freinage de service (50 %) dans {0}","Betriebsbremsung (50%) in {0} einleiten","{0}先で常用ブレーキ（50%）を開始"],"Урок 1. Знайомство з керуванням":["Lesson 1. Getting to know the controls","Урок 1. Знакомство с управлением","第 1 课：熟悉操纵","Lecția 1. Familiarizarea cu comenzile","Lição 1. Conhecendo os controles","Lección 1. Conoce los controles","Leçon 1. Découverte des commandes","Lektion 1. Die Bedienelemente","レッスン1：操作の基本"],"Тяга, гальмо, екстрене гальмування, реверс, спідометр, сигнал, фари й двірники.":["Throttle, brake, emergency braking, reverse, speedometer, horn, lights and wipers.","Тяга, тормоз, экстренное торможение, реверс, спидометр, сигнал, фары и дворники.","牵引、制动、紧急制动、换向、速度表、鸣笛、前灯和雨刷。","Tracțiunea, frâna, frânarea de urgență, inversarea sensului, vitezometrul, claxonul, farurile și ștergătoarele.","Tração, freio, frenagem de emergência, reversão, velocímetro, buzina, faróis e limpadores.","Tracción, freno, frenado de emergencia, reversa, velocímetro, bocina, faros y limpiaparabrisas.","Traction, frein, freinage d’urgence, inversion du sens, compteur de vitesse, klaxon, phares et essuie-glaces.","Zugkraft, Bremse, Schnellbremsung, Wenden, Tacho, Horn, Licht und Wischer.","力行、ブレーキ、非常ブレーキ、方向転換、速度計、警笛、前照灯、ワイパー。"],"Ліворуч — важіль ТЯГИ, праворуч — важіль ГАЛЬМА. Тягніть їх пальцем угору-вниз або використовуйте клавіші ↑ / ↓ (тяга) і Пробіл (гальмо). Угорі зліва — спідометр, ліміт швидкості та тиск у гальмівній магістралі.":["On the left is the THROTTLE lever, on the right the BRAKE lever. Drag them up and down with your finger or use the ↑ / ↓ keys (throttle) and Space (brake). At the top left are the speedometer, the speed limit and the brake-pipe pressure.","Слева — рычаг ТЯГИ, справа — рычаг ТОРМОЗА. Двигайте их пальцем вверх-вниз или используйте клавиши ↑ / ↓ (тяга) и Пробел (тормоз). Вверху слева — спидометр, ограничение скорости и давление в тормозной магистрали.","左侧是“牵引”手柄，右侧是“制动”手柄。用手指上下拖动，或使用 ↑ / ↓ 键（牵引）和空格键（制动）。左上方显示速度表、限速和列车管压力。","În stânga — maneta de TRACȚIUNE, în dreapta — maneta de FRÂNĂ. Glisați-le cu degetul în sus și în jos sau folosiți tastele ↑ / ↓ (tracțiune) și Spațiu (frână). Sus, în stânga — vitezometrul, limita de viteză și presiunea din conducta generală.","À esquerda fica a alavanca de TRAÇÃO, à direita a alavanca de FREIO. Arraste-as com o dedo para cima e para baixo ou use as teclas ↑ / ↓ (tração) e Espaço (freio). No canto superior esquerdo ficam o velocímetro, o limite de velocidade e a pressão no encanamento geral.","A la izquierda está la palanca de TRACCIÓN y a la derecha, la de FRENO. Deslízalas con el dedo hacia arriba o hacia abajo, o usa las teclas ↑ / ↓ (tracción) y Espacio (freno). Arriba a la izquierda verás el velocímetro, el límite de velocidad y la presión de la tubería general de freno.","À gauche, la manette de TRACTION ; à droite, la manette de FREIN. Faites-les glisser du doigt vers le haut ou vers le bas, ou utilisez les touches ↑ / ↓ (traction) et Espace (frein). En haut à gauche : le compteur de vitesse, la limite de vitesse et la pression dans la conduite générale.","Links ist der Hebel ZUGKRAFT, rechts der Hebel BREMSE. Zieh sie mit dem Finger nach oben oder unten oder nutze die Tasten ↑ / ↓ (Zugkraft) und die Leertaste (Bremse). Oben links siehst du Tacho, Tempolimit und den Druck in der Hauptluftleitung.","左が「力行」レバー、右が「ブレーキ」レバーです。レバーを指で上下にドラッグするか、↑ / ↓ キー（力行）とスペースキー（ブレーキ）で操作します。左上には速度計、制限速度、ブレーキ管圧力が表示されます。"],"Підніміть тягу до 30% або більше.":["Raise the throttle to 30% or more.","Увеличьте тягу до 30% или больше.","将牵引提高到 30% 或以上。","Ridicați tracțiunea la 30% sau mai mult.","Aumente a tração para 30% ou mais.","Sube la tracción al 30% o más.","Augmentez la traction à 30 % ou plus.","Erhöhe die Zugkraft auf 30% oder mehr.","力行を30%以上に上げてください。"],"Зніміть тягу до нуля й задійте гальмо щонайменше на 50%. Стрілка тиску впаде — це спрацьовують гальма.":["Bring the throttle back to zero and apply the brake to at least 50%. The pressure needle will drop — that’s the brakes being applied.","Сбросьте тягу до нуля и задействуйте тормоз минимум на 50%. Стрелка давления упадёт — это срабатывают тормоза.","将牵引退回到零，并施加至少 50% 的制动。压力表指针会下降——这表示制动正在起作用。","Reduceți tracțiunea la zero și acționați frâna cel puțin 50%. Acul manometrului va coborî — frânele intră în acțiune.","Reduza a tração a zero e aplique o freio em pelo menos 50%. O ponteiro de pressão vai cair — são os freios atuando.","Baja la tracción a cero y aplica el freno al menos al 50%. La aguja de presión bajará — eso significa que los frenos están actuando.","Ramenez la traction à zéro et serrez le frein à au moins 50 %. L’aiguille de pression baisse : les freins agissent.","Nimm die Zugkraft auf null zurück und bremse mit mindestens 50%. Der Druckzeiger fällt — die Bremsen legen an.","力行を0に戻し、ブレーキを50%以上かけてください。圧力の表示が下がります — ブレーキが作動している合図です。"],"Відпустіть гальмо й подайте звуковий сигнал: кнопка «Сигнал» або клавіша H.":["Release the brake and sound the horn: the “Horn” button or the H key.","Отпустите тормоз и подайте звуковой сигнал: кнопка «Сигнал» или клавиша H.","缓解制动并鸣笛：按“鸣笛”按钮或 H 键。","Eliberați frâna și dați un semnal sonor: butonul „Claxon” sau tasta H.","Solte o freio e toque a buzina: botão «Buzina» ou tecla H.","Suelta el freno y toca la bocina: botón «Bocina» o tecla H.","Desserrez le frein et actionnez le klaxon : bouton « Klaxon » ou touche H.","Löse die Bremse und gib ein Hornsignal: Schaltfläche „Horn“ oder Taste H.","ブレーキを緩め、警笛を鳴らしてください：「警笛」ボタンまたはHキー。"],"Увімкніть фари (кнопка «Фари» або L).":["Turn on the lights (the “Lights” button or L).","Включите фары (кнопка «Фары» или L).","打开前灯（“前灯”按钮或 L 键）。","Aprindeți farurile (butonul „Faruri” sau L).","Acenda os faróis (botão «Faróis» ou L).","Enciende los faros (botón «Faros» o L).","Allumez les phares (bouton « Phares » ou L).","Schalte die Scheinwerfer ein (Schaltfläche „Licht“ oder L).","前照灯を点灯してください（「前照灯」ボタンまたはL）。"],"Увімкніть двірники (кнопка «Двірники» або K).":["Turn on the wipers (the “Wipers” button or K).","Включите дворники (кнопка «Дворники» или K).","打开雨刷（“雨刷”按钮或 K 键）。","Porniți ștergătoarele (butonul „Ștergătoare” sau K).","Ligue os limpadores (botão «Limpadores» ou K).","Activa los limpiaparabrisas (botón «Limpiaparabrisas» o K).","Activez les essuie-glaces (bouton « Essuie-glaces » ou K).","Schalte die Scheibenwischer ein (Schaltfläche „Wischer“ oder K).","ワイパーを作動させてください（「ワイパー」ボタンまたはK）。"],"Натисніть «Екстрено» (або X): екстрене гальмування випускає повітря з магістралі за секунди й зупиняє потяг найкоротшим шляхом.":["Press “Emergency” (or X): emergency braking vents the air from the brake pipe within seconds and stops the train in the shortest possible distance.","Нажмите «Экстренное» (или X): экстренное торможение выпускает воздух из магистрали за секунды и останавливает поезд на кратчайшем расстоянии.","按下“紧急制动”（或 X 键）：紧急制动会在数秒内排出列车管中的空气，以最短距离停车。","Apăsați „Urgență” (sau X): frânarea de urgență golește aerul din conducta generală în câteva secunde și oprește trenul pe cea mai scurtă distanță.","Toque em «Emergência» (ou X): a frenagem de emergência esvazia o ar do encanamento geral em segundos e para o trem na menor distância possível.","Pulsa «Emergencia» (o X): el frenado de emergencia vacía de aire la tubería general en segundos y detiene el tren en la distancia más corta posible.","Appuyez sur « Urgence » (ou X) : le freinage d’urgence vide l’air de la conduite générale en quelques secondes et arrête le train sur la plus courte distance possible.","Drücke „Notbremse“ (oder X): Die Schnellbremsung entlüftet die Hauptluftleitung in Sekunden und bringt den Zug auf dem kürzesten Weg zum Stehen.","「非常」（またはX）を押してください。非常ブレーキはブレーキ管の空気を数秒で排出し、最短距離で列車を停止させます。"],"Спідометр показує швидкість у км/год, червоне коло — поточний ліміт. Якщо поруч з’являється «▼ 60 · 800 м», попереду обмеження. Тиск 5,0 бар — гальма відпущені; що нижчий тиск, то сильніше гальмує потяг.":["The speedometer shows speed in km/h; the red circle marks the current limit. If “▼ 60 · 800 m” appears next to it, there is a restriction ahead. A pressure of 5.0 bar means the brakes are released; the lower the pressure, the harder the train brakes.","Спидометр показывает скорость в км/ч, красный круг — текущее ограничение. Если рядом появляется «▼ 60 · 800 м», впереди ограничение. Давление 5,0 бар — тормоза отпущены; чем ниже давление, тем сильнее тормозит поезд.","速度表以公里/小时显示速度，红圈表示当前限速。如果旁边出现“▼ 60 · 800 米”，说明前方有限速。压力为 5.0 巴表示制动已缓解；压力越低，列车制动力越强。","Vitezometrul arată viteza în km/h, cercul roșu — limita curentă. Dacă alături apare „▼ 60 · 800 m”, urmează o restricție. Presiune de 5,0 bar — frânele sunt eliberate; cu cât presiunea este mai mică, cu atât trenul frânează mai puternic.","O velocímetro mostra a velocidade em km/h; o círculo vermelho é o limite atual. Se aparecer «▼ 60 · 800 m» ao lado, há uma restrição à frente. Pressão de 5,0 bar — freios soltos; quanto menor a pressão, mais forte o trem freia.","El velocímetro muestra la velocidad en km/h; el círculo rojo es el límite actual. Si al lado aparece «▼ 60 · 800 m», hay una limitación más adelante. Con una presión de 5,0 bar los frenos están aflojados — cuanto menor es la presión, más frena el tren.","Le compteur indique la vitesse en km/h ; le cercle rouge, la limite actuelle. Si « ▼ 60 · 800 m » apparaît à côté, une limitation de vitesse approche. À 5,0 bar, les freins sont desserrés ; plus la pression est basse, plus le train freine fort.","Der Tacho zeigt die Geschwindigkeit in km/h, der rote Kreis das aktuelle Tempolimit. Erscheint daneben „▼ 60 · 800 m“, steht eine Beschränkung bevor. Druck 5,0 bar — die Bremsen sind gelöst; je niedriger der Druck, desto stärker bremst der Zug.","速度計はkm/h単位で速度を表示し、赤い円は現在の制限速度を示します。横に「▼ 60 · 800 m」と表示されたら、前方に速度制限があります。圧力5.0 barはブレーキが緩んだ状態で、圧力が低いほどブレーキが強く効きます。"],"Реверс змінює напрямок руху й можливий лише на зупинці. Відкрийте «Меню» й натисніть «Реверс».":["Reverse changes the direction of travel and is only possible when stopped. Open “Menu” and press “Reverse”.","Реверс меняет направление движения и возможен только на остановке. Откройте «Меню» и нажмите «Реверс».","“换向”用于改变行驶方向，只能在停车时操作。打开“菜单”并点按“换向”。","Inversarea schimbă sensul de mers și este posibilă doar în staționare. Deschideți „Meniu” și apăsați „Inversare”.","A reversão muda o sentido de marcha e só é possível com o trem parado. Abra o «Menu» e toque em «Reversão».","La reversa cambia el sentido de la marcha y solo es posible con el tren detenido. Abre «Menú» y pulsa «Reversa».","L’inversion change le sens de marche et n’est possible qu’à l’arrêt. Ouvrez « Menu » et appuyez sur « Inverser ».","Wenden kehrt die Fahrtrichtung um und ist nur im Stillstand möglich. Öffne das „Menü“ und tippe auf „Wenden“.","「方向転換」は進行方向を切り替える機能で、停車中のみ使用できます。「メニュー」を開いて「方向転換」を押してください。"],"Урок 2. Розгін і підтримання швидкості":["Lesson 2. Accelerating and holding speed","Урок 2. Разгон и поддержание скорости","第 2 课：加速与保持速度","Lecția 2. Accelerarea și menținerea vitezei","Lição 2. Aceleração e manutenção da velocidade","Lección 2. Aceleración y mantenimiento de la velocidad","Leçon 2. Accélérer et maintenir la vitesse","Lektion 2. Beschleunigen und Tempo halten","レッスン2：加速と速度の維持"],"Як тяга й маса впливають на прискорення, як тримати задану швидкість і чому потягу потрібна велика гальмівна дистанція.":["How throttle and mass affect acceleration, how to hold a set speed, and why a train needs a long braking distance.","Как тяга и масса влияют на ускорение, как держать заданную скорость и почему поезду нужен большой тормозной путь.","牵引力和质量如何影响加速度，如何保持设定速度，以及列车为何需要很长的制动距离。","Cum influențează tracțiunea și masa accelerația, cum se menține o viteză dată și de ce trenul are nevoie de o distanță mare de frânare.","Como a tração e a massa afetam a aceleração, como manter uma velocidade definida e por que o trem precisa de uma grande distância de frenagem.","Cómo influyen la tracción y la masa en la aceleración, cómo mantener una velocidad fija y por qué un tren necesita una gran distancia de frenado.","Comment la traction et la masse influencent l’accélération, comment maintenir une vitesse donnée et pourquoi un train a besoin d’une longue distance de freinage.","Wie Zugkraft und Masse die Beschleunigung beeinflussen, wie du eine Geschwindigkeit hältst und warum ein Zug einen langen Bremsweg braucht.","力行と質量が加速にどう影響するか、一定の速度を保つ方法、そして列車に長い制動距離が必要な理由を学びます。"],"Ваш склад: локомотив і {0} вагонів, маса {1} т, максимальна сила тяги {2} кН. Прискорення на рушанні ≈ {3} м/с². Що важчий потяг, то повільніше він розганяється й довше гальмує.":["Your consist: a locomotive and {0} cars, mass {1} t, maximum tractive effort {2} kN. Starting acceleration ≈ {3} m/s². The heavier the train, the more slowly it accelerates and the longer it takes to brake.","Ваш состав: локомотив и {0} ваг., масса {1} т, максимальная сила тяги {2} кН. Ускорение при трогании ≈ {3} м/с². Чем тяжелее поезд, тем медленнее он разгоняется и тем дольше тормозит.","你的列车：机车加 {0} 节车厢，质量 {1} 吨，最大牵引力 {2} 千牛。起动加速度 ≈ {3} m/s²。列车越重，加速越慢，制动距离也越长。","Garnitura dvs.: locomotivă și {0} vagoane, masă {1} t, forță de tracțiune maximă {2} kN. Accelerația la demarare ≈ {3} m/s². Cu cât trenul este mai greu, cu atât accelerează mai încet și frânează pe o distanță mai mare.","Sua composição: locomotiva e {0} vagões, massa de {1} t, força de tração máxima de {2} kN. Aceleração na partida ≈ {3} m/s². Quanto mais pesado o trem, mais devagar ele acelera e mais demora para frear.","Tu composición: locomotora y {0} vagones, masa de {1} t, esfuerzo de tracción máximo de {2} kN. Aceleración al arrancar ≈ {3} m/s². Cuanto más pesado es el tren, más despacio acelera y más tarda en frenar.","Votre train : une locomotive et {0} voitures, masse {1} t, effort de traction maximal {2} kN. Accélération au démarrage ≈ {3} m/s². Plus le train est lourd, plus il accélère lentement et plus il freine sur une longue distance.","Dein Zug: Lok und {0} Wagen, Masse {1} t, maximale Zugkraft {2} kN. Anfahrbeschleunigung ≈ {3} m/s². Je schwerer der Zug, desto langsamer beschleunigt er und desto länger bremst er.","あなたの編成：機関車と客車{0}両、質量{1} t、最大牽引力{2} kN。起動加速度は ≈ {3} m/s²です。列車が重いほど加速は遅く、制動距離は長くなります。"],"Розженіться до 60 км/год. Тяга 100% дає найшвидший розгін.":["Accelerate to 60 km/h. 100% throttle gives the fastest acceleration.","Разгонитесь до 60 км/ч. Тяга 100% даёт самый быстрый разгон.","加速到 60 公里/小时。100% 牵引加速最快。","Accelerați până la 60 km/h. Tracțiunea de 100% oferă cea mai rapidă accelerare.","Acelere até 60 km/h. Tração de 100% dá a aceleração mais rápida.","Acelera hasta 60 km/h. Con la tracción al 100% se obtiene la aceleración más rápida.","Accélérez jusqu’à 60 km/h. Une traction de 100 % donne l’accélération la plus rapide.","Beschleunige auf 60 km/h. 100% Zugkraft ergibt die schnellste Beschleunigung.","60 km/hまで加速してください。力行100%で最も速く加速できます。"],"Розгін до 60 км/год зайняв {0} с. За фізикою гри цей склад розганяється до 60 км/год за ≈{1} с, а склад із 12 вагонів — за ≈{2} с.":["Accelerating to 60 km/h took {0} s. According to the game’s physics, this consist reaches 60 km/h in ≈{1} s, and a 12-car consist in ≈{2} s.","Разгон до 60 км/ч занял {0} с. По физике игры этот состав разгоняется до 60 км/ч за ≈{1} с, а состав из 12 вагонов — за ≈{2} с.","加速到 60 公里/小时用时 {0} 秒。按游戏物理计算，这列车加速到 60 公里/小时需 ≈{1} 秒，12 节编组的列车则需 ≈{2} 秒。","Accelerarea până la 60 km/h a durat {0} s. Conform fizicii jocului, această garnitură ajunge la 60 km/h în ≈{1} s, iar o garnitură de 12 vagoane — în ≈{2} s.","A aceleração até 60 km/h levou {0} s. Pela física do jogo, esta composição chega a 60 km/h em ≈{1} s, e uma composição de 12 vagões, em ≈{2} s.","Acelerar hasta 60 km/h te llevó {0} s. Según la física del juego, esta composición alcanza los 60 km/h en ≈{1} s, y una de 12 vagones, en ≈{2} s.","L’accélération jusqu’à 60 km/h a pris {0} s. Selon la physique du jeu, ce train atteint 60 km/h en ≈{1} s, et une rame de 12 voitures en ≈{2} s.","Die Beschleunigung auf 60 km/h hat {0} s gedauert. Laut Spielphysik erreicht dieser Zug 60 km/h in ≈{1} s, ein Zug mit 12 Wagen in ≈{2} s.","60 km/hまでの加速に{0}秒かかりました。ゲームの物理計算では、この編成は60 km/hまで≈{1}秒、12両編成なら≈{2}秒で加速します。"],"Тримайте швидкість 80 ± 5 км/год протягом 30 секунд. Залишилось: {0} с.":["Hold 80 ± 5 km/h for 30 seconds. Remaining: {0} s.","Держите скорость 80 ± 5 км/ч в течение 30 секунд. Осталось: {0} с.","将速度保持在 80 ± 5 公里/小时，持续 30 秒。剩余：{0} 秒。","Mențineți viteza de 80 ± 5 km/h timp de 30 de secunde. Au rămas: {0} s.","Mantenha a velocidade em 80 ± 5 km/h por 30 segundos. Restam: {0} s.","Mantén una velocidad de 80 ± 5 km/h durante 30 segundos. Quedan: {0} s.","Maintenez 80 ± 5 km/h pendant 30 secondes. Temps restant : {0} s.","Halte 30 Sekunden lang 80 ± 5 km/h. Verbleibend: {0} s.","80 ± 5 km/hの速度を30秒間保ってください。残り：{0}秒。"],"Зараз ви їдете {0} км/год. Службове гальмування (50%) зупинить потяг через ≈{1} м за {2} с, повне службове — через ≈{3} м, екстрене — через ≈{4} м. Потяг важкий, а зчеплення сталевих коліс з рейкою мале, тому гальмувати треба задовго до зупинки.":["You are now doing {0} km/h. Service braking (50%) will stop the train in ≈{1} m over {2} s, full service in ≈{3} m, emergency in ≈{4} m. The train is heavy and the adhesion between steel wheels and rail is low, so you have to start braking well before the stop.","Сейчас вы едете со скоростью {0} км/ч. Служебное торможение (50%) остановит поезд через ≈{1} м за {2} с, полное служебное — через ≈{3} м, экстренное — через ≈{4} м. Поезд тяжёлый, а сцепление стальных колёс с рельсом невелико, поэтому тормозить нужно задолго до остановки.","当前速度 {0} 公里/小时。常用制动（50%）将在 ≈{1} 米、{2} 秒内停车；最大常用制动需 ≈{3} 米，紧急制动需 ≈{4} 米。列车很重，而钢轮与钢轨之间的黏着力很小，因此必须在停车点之前很远就开始制动。","Acum circulați cu {0} km/h. Frânarea de serviciu (50%) va opri trenul după ≈{1} m, în {2} s, frânarea de serviciu completă — după ≈{3} m, cea de urgență — după ≈{4} m. Trenul este greu, iar aderența roților de oțel pe șină este mică, de aceea trebuie să frânați cu mult înainte de oprire.","Agora você está a {0} km/h. A frenagem de serviço (50%) para o trem em ≈{1} m e {2} s; a frenagem de serviço total, em ≈{3} m; a de emergência, em ≈{4} m. O trem é pesado e a aderência das rodas de aço ao trilho é baixa, por isso é preciso frear muito antes da parada.","Ahora vas a {0} km/h. El frenado de servicio (50%) detendrá el tren en ≈{1} m y {2} s; el de servicio completo, en ≈{3} m; el de emergencia, en ≈{4} m. El tren es pesado y la adherencia entre las ruedas de acero y el riel es baja, así que hay que frenar mucho antes de la parada.","Vous roulez à {0} km/h. Un freinage de service (50 %) arrêtera le train en ≈{1} m et {2} s, un freinage de service maximal en ≈{3} m, un freinage d’urgence en ≈{4} m. Le train est lourd et l’adhérence de l’acier des roues sur le rail est faible : il faut donc freiner bien avant l’arrêt.","Du fährst gerade {0} km/h. Eine Betriebsbremsung (50%) bringt den Zug nach ≈{1} m in {2} s zum Stehen, eine volle Betriebsbremsung nach ≈{3} m, eine Schnellbremsung nach ≈{4} m. Der Zug ist schwer und die Haftung zwischen Stahlrad und Schiene gering, deshalb musst du lange vor dem Halt bremsen.","現在の速度は{0} km/hです。常用ブレーキ（50%）では{2}秒、≈{1} mで停止し、常用最大ブレーキでは≈{3} m、非常ブレーキでは≈{4} mで停止します。列車は重く、鋼鉄の車輪とレールの間の粘着力は小さいため、停車位置のずっと手前からブレーキをかける必要があります。"],"Зупиніть потяг службовим гальмом (40–70%), без екстреного.":["Stop the train with the service brake (40–70%), without emergency braking.","Остановите поезд служебным торможением (40–70%), без экстренного.","使用常用制动（40–70%）停车，不要使用紧急制动。","Opriți trenul cu frâna de serviciu (40–70%), fără frânare de urgență.","Pare o trem com o freio de serviço (40–70%), sem usar a emergência.","Detén el tren con el freno de servicio (40–70%), sin usar el de emergencia.","Arrêtez le train avec le frein de service (40–70 %), sans freinage d’urgence.","Halte den Zug mit der Betriebsbremse (40–70%) an, ohne Schnellbremsung.","非常ブレーキを使わずに、常用ブレーキ（40–70%）で列車を停止させてください。"],"Екстрене гальмування спрацювало — наступного разу обійдіться службовим.":["Emergency braking was applied — next time, use the service brake.","Сработало экстренное торможение — в следующий раз обойдитесь служебным.","触发了紧急制动——下次请只用常用制动。","A intervenit frânarea de urgență — data viitoare folosiți doar frâna de serviciu.","A frenagem de emergência foi acionada — da próxima vez, use apenas o freio de serviço.","Se activó el frenado de emergencia — la próxima vez usa solo el de servicio.","Le freinage d’urgence s’est déclenché — la prochaine fois, contentez-vous du frein de service.","Die Schnellbremsung wurde ausgelöst — versuch es nächstes Mal mit der Betriebsbremse.","非常ブレーキが作動しました — 次は常用ブレーキだけで止めてみましょう。"],"Урок 3. Під’їзд до станції":["Lesson 3. Approaching a station","Урок 3. Подъезд к станции","第 3 课：进站","Lecția 3. Apropierea de stație","Lição 3. Aproximação da estação","Lección 3. Aproximación a la estación","Leçon 3. Arrivée en gare","Lektion 3. Einfahrt in den Bahnhof","レッスン3：駅への進入"],"Як розрахувати момент початку гальмування з 120 км/год за 5 км до станції.":["How to work out when to start braking from 120 km/h, 5 km before the station.","Как рассчитать момент начала торможения со 120 км/ч за 5 км до станции.","距车站 5 公里、速度 120 公里/小时时，如何计算开始制动的时机。","Cum se calculează momentul începerii frânării de la 120 km/h, la 5 km de stație.","Como calcular o momento de começar a frear a 120 km/h, a 5 km da estação.","Cómo calcular cuándo empezar a frenar desde 120 km/h a 5 km de la estación.","Comment calculer le moment où commencer à freiner depuis 120 km/h, à 5 km de la gare.","Wie du aus 120 km/h, 5 km vor dem Bahnhof, den richtigen Bremsbeginn berechnest.","駅の5 km手前、120 km/hからブレーキを開始するタイミングの計算方法を学びます。"],"Швидкість 120 км/год, до мітки зупинки (центр перону) — 5 км. Службове гальмування 50% з цієї швидкості зупиняє потяг за ≈{0} м і ≈{1} с, тож почати його треба приблизно за {2} до мітки. На станції діють обмеження 90 / 60 / 40 км/год — зручно заздалегідь знизити швидкість до 80–90 км/год і гальмувати плавно. Підказки помічника — праворуч.":["Speed 120 km/h, 5 km to the stop mark (center of the platform). Service braking at 50% from this speed stops the train in ≈{0} m and ≈{1} s, so you need to start about {2} before the mark. The station has 90 / 60 / 40 km/h limits — it’s best to slow down to 80–90 km/h in advance and brake smoothly. The assistant’s hints are on the right.","Скорость 120 км/ч, до метки остановки (центр перрона) — 5 км. Служебное торможение 50% с этой скорости останавливает поезд за ≈{0} м и ≈{1} с, поэтому начинать его нужно примерно за {2} до метки. На станции действуют ограничения 90 / 60 / 40 км/ч — удобно заранее снизить скорость до 80–90 км/ч и тормозить плавно. Подсказки помощника — справа.","速度 120 公里/小时，距停车标（站台中央）5 公里。从该速度施加 50% 常用制动，列车需 ≈{0} 米、≈{1} 秒才能停下，因此应在距停车标约 {2} 处开始制动。车站内有 90 / 60 / 40 公里/小时的限速——最好提前将速度降到 80–90 公里/小时，再平稳制动。助手提示显示在右侧。","Viteza 120 km/h, până la marcajul de oprire (centrul peronului) — 5 km. Frânarea de serviciu de 50% de la această viteză oprește trenul în ≈{0} m și ≈{1} s, deci trebuie începută cu aproximativ {2} înainte de marcaj. În stație sunt restricții de 90 / 60 / 40 km/h — este bine să reduceți din timp viteza la 80–90 km/h și să frânați lin. Indicațiile asistentului — în dreapta.","Velocidade de 120 km/h; até a marca de parada (centro da plataforma) — 5 km. A frenagem de serviço de 50% a partir dessa velocidade para o trem em ≈{0} m e ≈{1} s, então é preciso iniciá-la cerca de {2} antes da marca. Na estação valem limites de 90 / 60 / 40 km/h — convém reduzir antes para 80–90 km/h e frear suavemente. As dicas do assistente ficam à direita.","Velocidad: 120 km/h; distancia hasta la marca de parada (centro del andén): 5 km. Un frenado de servicio del 50% desde esta velocidad detiene el tren en ≈{0} m y ≈{1} s, así que debes iniciarlo aproximadamente a {2} de la marca. En la estación rigen limitaciones de 90 / 60 / 40 km/h — conviene reducir antes la velocidad a 80–90 km/h y frenar de forma suave. Las indicaciones del asistente aparecen a la derecha.","Vitesse 120 km/h, repère d’arrêt (milieu du quai) à 5 km. Depuis cette vitesse, un freinage de service à 50 % arrête le train en ≈{0} m et ≈{1} s : il faut donc le commencer environ {2} avant le repère. En gare, des limitations de 90 / 60 / 40 km/h s’appliquent — il est pratique de réduire d’avance la vitesse à 80–90 km/h et de freiner progressivement. Les conseils de l’assistant s’affichent à droite.","Geschwindigkeit 120 km/h, bis zur Haltemarke (Bahnsteigmitte) sind es 5 km. Eine Betriebsbremsung mit 50% bringt den Zug aus dieser Geschwindigkeit in ≈{0} m und ≈{1} s zum Stehen, du musst also etwa {2} vor der Marke damit beginnen. Im Bahnhof gelten Beschränkungen von 90 / 60 / 40 km/h — senke die Geschwindigkeit am besten schon vorher auf 80–90 km/h und bremse sanft. Die Hinweise des Assistenten findest du rechts.","速度120 km/h、停止位置目標（ホーム中央）まで5 km。この速度から常用ブレーキ50%をかけると、列車は≈{0} m、≈{1}秒で停止するため、停止位置目標の約{2}手前でブレーキを開始する必要があります。駅構内には90 / 60 / 40 km/hの速度制限があります — あらかじめ80–90 km/hまで減速し、なめらかにブレーキをかけるとよいでしょう。アシストのヒントは右側に表示されます。"],"Ведіть потяг до станції й зупиніться біля жовто-чорної мітки на пероні.":["Drive the train to the station and stop at the yellow-and-black mark on the platform.","Ведите поезд к станции и остановитесь у жёлто-чёрной метки на перроне.","驾驶列车进站，停在站台上黄黑相间的停车标处。","Conduceți trenul până în stație și opriți la marcajul galben-negru de pe peron.","Conduza o trem até a estação e pare junto à marca amarela e preta da plataforma.","Conduce el tren hasta la estación y detente en la marca amarilla y negra del andén.","Conduisez le train jusqu’à la gare et arrêtez-vous au repère jaune et noir du quai.","Fahre den Zug in den Bahnhof und halte an der gelb-schwarzen Marke am Bahnsteig.","列車を駅まで運転し、ホームにある黄色と黒の停止位置目標に停車してください。"],"Урок 4. Точна зупинка":["Lesson 4. Precise stop","Урок 4. Точная остановка","第 4 课：精准停车","Lecția 4. Oprirea precisă","Lição 4. Parada precisa","Lección 4. Parada precisa","Leçon 4. Arrêt précis","Lektion 4. Präziser Halt","レッスン4：定位置停止"],"Зупинка в межах метра від мітки: оцінка та розбір помилок.":["Stopping within a meter of the mark: grading and error analysis.","Остановка в пределах метра от метки: оценка и разбор ошибок.","在距停车标 1 米以内停车：评分与误差分析。","Oprirea la cel mult un metru de marcaj: evaluarea și analiza greșelilor.","Parar a menos de um metro da marca: avaliação e análise dos erros.","Parar a menos de un metro de la marca: evaluación y análisis de errores.","S’arrêter à moins d’un mètre du repère : notation et analyse des erreurs.","Halt auf einen Meter genau an der Marke: Bewertung und Fehleranalyse.","停止位置目標から1 m以内での停車：評価とミスの解説。"],"Потяг іде 60 км/год, до мітки 1,4 км. Оцінка: до 1 м — ідеально, до 3 м — відмінно, до 8 м — добре, далі — погано; якщо потяг не вмістився на пероні — перон пропущено. Порада: гальмуйте раніше й слабше, а в кінці відпускайте гальмо, щоб зупинитися м’яко.":["The train is doing 60 km/h, 1.4 km from the mark. Grading: within 1 m — perfect, within 3 m — excellent, within 8 m — good, beyond that — poor; if the train doesn’t fit on the platform — platform missed. Tip: brake earlier and more gently, and release the brake at the end to stop smoothly.","Поезд идёт со скоростью 60 км/ч, до метки 1,4 км. Оценка: до 1 м — идеально, до 3 м — отлично, до 8 м — хорошо, дальше — плохо; если поезд не уместился на перроне — перрон пропущен. Совет: тормозите раньше и слабее, а в конце отпускайте тормоз, чтобы остановиться мягко.","列车速度 60 公里/小时，距停车标 1.4 公里。评分：1 米以内为完美，3 米以内为优秀，8 米以内为良好，超出则为欠佳；若列车未能完全停在站台范围内，则判定为错过站台。提示：提早制动、力度放轻，最后缓解制动，平稳停车。","Trenul circulă cu 60 km/h, până la marcaj sunt 1,4 km. Evaluare: până la 1 m — perfect, până la 3 m — excelent, până la 8 m — bine, mai mult — slab; dacă trenul nu a încăput la peron — peron ratat. Sfat: frânați mai devreme și mai ușor, iar la final slăbiți frâna pentru a opri lin.","O trem está a 60 km/h, a 1,4 km da marca. Avaliação: até 1 m — perfeita, até 3 m — excelente, até 8 m — boa, além disso — ruim; se o trem não couber na plataforma — plataforma perdida. Dica: freie mais cedo e mais suavemente e, no final, solte o freio para parar com suavidade.","El tren va a 60 km/h y la marca está a 1,4 km. Evaluación: hasta 1 m — perfecta; hasta 3 m — excelente; hasta 8 m — buena; más — mala; si el tren no cabe en el andén — fuera del andén. Consejo: frena antes y con menos fuerza, y al final afloja el freno para detenerte con suavidad.","Le train roule à 60 km/h, le repère est à 1,4 km. Notation : jusqu’à 1 m — parfait, jusqu’à 3 m — excellent, jusqu’à 8 m — bon, au-delà — mauvais ; si le train ne tient pas le long du quai — quai manqué. Conseil : freinez plus tôt et moins fort, puis desserrez le frein à la fin pour vous arrêter en douceur.","Der Zug fährt 60 km/h, bis zur Marke sind es 1,4 km. Bewertung: bis 1 m — perfekt, bis 3 m — sehr gut, bis 8 m — gut, darüber — schlecht; passt der Zug nicht an den Bahnsteig, gilt der Bahnsteig als verpasst. Tipp: Brems früher und schwächer und löse am Ende die Bremse, um sanft anzuhalten.","列車は60 km/hで走行中、停止位置目標まで1.4 km。評価：1 m以内 — 完璧、3 m以内 — 優秀、8 m以内 — 良好、それ以上 — 不十分。列車がホームに収まらなかった場合は「ホーム通過」となります。コツ：早めに弱くブレーキをかけ、最後はブレーキを緩めてやわらかく停車しましょう。"],"Зупиніться якомога точніше біля мітки.":["Stop as close to the mark as you can.","Остановитесь как можно точнее у метки.","尽量精准地停在停车标处。","Opriți cât mai precis la marcaj.","Pare o mais próximo possível da marca.","Detente lo más cerca posible de la marca.","Arrêtez-vous le plus près possible du repère.","Halte so genau wie möglich an der Marke.","停止位置目標にできるだけ正確に停車してください。"],"Урок 5. Гальмування на різних швидкостях":["Lesson 5. Braking at different speeds","Урок 5. Торможение на разных скоростях","第 5 课：不同速度下的制动","Lecția 5. Frânarea la diferite viteze","Lição 5. Frenagem em diferentes velocidades","Lección 5. Frenado a distintas velocidades","Leçon 5. Freiner à différentes vitesses","Lektion 5. Bremsen bei verschiedenen Geschwindigkeiten","レッスン5：さまざまな速度でのブレーキ"],"Гальмівний шлях росте приблизно з квадратом швидкості: 40–250 км/год.":["Braking distance grows roughly with the square of speed: 40–250 km/h.","Тормозной путь растёт примерно пропорционально квадрату скорости: 40–250 км/ч.","制动距离大约与速度的平方成正比：40–250 公里/小时。","Distanța de frânare crește aproximativ cu pătratul vitezei: 40–250 km/h.","A distância de frenagem cresce aproximadamente com o quadrado da velocidade: 40–250 km/h.","La distancia de frenado crece aproximadamente con el cuadrado de la velocidad: 40–250 km/h.","La distance de freinage croît à peu près comme le carré de la vitesse : 40–250 km/h.","Der Bremsweg wächst etwa mit dem Quadrat der Geschwindigkeit: 40–250 km/h.","制動距離は速度のほぼ2乗に比例して伸びます：40–250 km/h。"],"Спроба: {0} км/год, {1}. Службове гальмування (50%) на рівній колії займе ≈{2} м. Мітка — за {3}.":["Attempt: {0} km/h, {1}. Service braking (50%) on level track will take ≈{2} m. The mark is {3} ahead.","Попытка: {0} км/ч, {1}. Служебное торможение (50%) на ровном пути займёт ≈{2} м. Метка — через {3}.","本次尝试：{0} 公里/小时，{1}。在平直线路上，常用制动（50%）需 ≈{2} 米。停车标位于前方 {3}。","Încercare: {0} km/h, {1}. Frânarea de serviciu (50%) pe linie orizontală va necesita ≈{2} m. Marcajul — la {3}.","Tentativa: {0} km/h, {1}. A frenagem de serviço (50%) em via plana levará ≈{2} m. A marca está a {3}.","Intento: {0} km/h, {1}. El frenado de servicio (50%) en vía llana requerirá ≈{2} m. La marca está a {3}.","Essai : {0} km/h, {1}. Un freinage de service (50 %) sur voie plate prendra ≈{2} m. Repère à {3}.","Versuch: {0} km/h, {1}. Eine Betriebsbremsung (50%) braucht auf ebener Strecke ≈{2} m. Die Marke liegt {3} entfernt.","試行：{0} km/h、{1}。平坦な線路での常用ブレーキ（50%）の制動距離は≈{2}

org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=true

# ---- AdMob (fill in before building a release; debug builds always use Google's public test IDs) ----
# App ID from AdMob > Apps > App settings, e.g. ca-app-pub-1234567890123456~1234567890
admob.appId=ca-app-pub-7389308732042512~6246758735
# Rewarded ad unit from AdMob > Apps > Ad units, e.g. ca-app-pub-1234567890123456/1234567890
admob.rewardedId=ca-app-pub-7389308732042512/4275201510
# Optional: hashed test-device id printed by the UMP SDK in logcat, to test the EEA consent form in debug builds
ump.testDevice=
